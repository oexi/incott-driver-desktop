[package]
name = "incott-driver"
version = "2.0.1"
description = "Desktop driver for INCOTT mice"
authors = ["oexi"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
# Linux 只用 hidraw 后端：libusb 后端会把内核驱动卸掉（鼠标直接失灵），也拿不到 usage page
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 与 Chromium 一样以共享方式打开设备
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
os_info = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# 与 tauri 用的同一版本：设置窗口阴影区（自绘边框）
gtk = "0.18"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
